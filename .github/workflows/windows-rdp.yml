          $deadline = $start.AddMinutes(350)

          "PART_STARTED_AT=$($start.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_BACKUP_AT=$($backupAt.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_DEADLINE_AT=$($deadline.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append

