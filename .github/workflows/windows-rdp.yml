          '@
              Set-Content -Path $taskScript -Value $script -Encoding UTF8
              $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$taskScript`""
