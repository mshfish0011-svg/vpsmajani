          Write-Host "Backup created: $($manifest.created_at)"
          Write-Host "Source workflow run: $($manifest.workflow_run_id)"

          $sourceRoot = Join-Path $downloadDir 'NvDAdmin'
          $targetRoot = 'C:\Users\NvDAdmin'
          $relativeFolders = @(
            'Desktop',
            'Documents',
            'Downloads',
            'Pictures',
            'Music',
            'Videos',
            'AppData\Roaming',
            'AppData\Local\Programs',
            'AppData\Local\Google\Chrome\User Data',
            'AppData\Local\Microsoft\Edge\User Data',
            'AppData\Roaming\Mozilla\Firefox'
          )

          if (-not (Test-Path $sourceRoot)) {
              Write-Host 'No user-profile payload exists in the backup.'
          }
          elseif (Test-Path $targetRoot) {
              Write-Host 'NvDAdmin profile exists. Performing immediate restore.'
