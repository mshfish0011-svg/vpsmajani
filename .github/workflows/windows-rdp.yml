name: Windows Cloud RDP - 8 Part Chain

'on':
  workflow_dispatch:
    inputs:
      restore_backup:
        description: 'Part 1: restore the newest valid backup from a previous chain'
        required: true
        default: true
        type: boolean
      restore_apps:
        description: 'Attempt best-effort WinGet application restore from the backup'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-cloud-rdp-chain
  cancel-in-progress: false

jobs:
  part1:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PART_NUMBER: '1'

    steps:
      - name: 1. Initialize Part Timing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $start = Get-Date
          $backupAt = $start.AddMinutes(330)
          $deadline = $start.AddMinutes(350)

          "PART_STARTED_AT=$($start.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_BACKUP_AT=$($backupAt.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_DEADLINE_AT=$($deadline.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Part $env:PART_NUMBER started at: $start"
          Write-Host "Backup phase at: $backupAt"
          Write-Host "Part deadline: $deadline"

      - name: 2. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name 'TermService' -StartupType Automatic
          Start-Service -Name 'TermService' -ErrorAction SilentlyContinue

          $svc = Get-Service -Name 'TermService'
          if ($svc.Status -ne 'Running') {
              throw 'Remote Desktop service could not be started.'
          }

      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Password = ConvertTo-SecureString 'P@ssw0rd1qazXSW@#' -AsPlainText -Force
          $existingUser = Get-LocalUser -Name 'NvDAdmin' -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              New-LocalUser -Name 'NvDAdmin' -Password $Password -PasswordNeverExpires -AccountNeverExpires -Description 'Windows Cloud RDP Admin'
          } else {
              Set-LocalUser -Name 'NvDAdmin' -Password $Password
              Enable-LocalUser -Name 'NvDAdmin'
          }

          Add-LocalGroupMember -Group 'Administrators' -Member 'NvDAdmin' -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 4. Prepare Backup Directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'C:\RDPBackup\Restore\Downloaded' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\RDPBackup\Snapshot' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\RDPBackup\Logs' -Force | Out-Null
          icacls 'C:\RDPBackup' /grant 'NvDAdmin:(OI)(CI)F' /T /C | Out-Null

      - name: 5. Restore Previous Environment Backup (Part 1 optional)
        if: ${{ inputs.restore_backup }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = 'C:\RDPBackup\Restore\Downloaded'
          Remove-Item $downloadDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

          gh --version
          $repo = $env:GITHUB_REPOSITORY
          $json = gh api "repos/$repo/actions/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Artifact API request failed.' }
          $data = $json | ConvertFrom-Json

          $latest = $data.artifacts |
            Where-Object { $_.name -like 'windows-cloud-backup-part*-*' -and $_.expired -eq $false } |
            Sort-Object { [DateTime]$_.created_at } -Descending |
            Select-Object -First 1

          if (-not $latest) {
              Write-Host 'No previous chain backup found. Starting Part 1 from a clean environment.'
              exit 0
          }

          Write-Host "Using previous-chain backup: $($latest.name)"
          gh run download $latest.workflow_run.id -n $latest.name -D $downloadDir
          if ($LASTEXITCODE -ne 0) { throw 'Previous-chain backup download failed.' }

          Write-Host 'Previous-chain backup downloaded.'

      - name: 6. Validate and Restore Backup Data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = 'C:\RDPBackup\Restore\Downloaded'
          $manifestPath = Join-Path $downloadDir 'Metadata\manifest.json'
          $hashPath = Join-Path $downloadDir 'Metadata\manifest.sha256.json'

          if (-not (Test-Path $manifestPath)) {
              Write-Host 'No backup payload exists for this part.'
              exit 0
          }

          if (-not (Test-Path $hashPath)) { throw 'manifest.sha256.json is missing.' }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $expected = (Get-Content $hashPath -Raw | ConvertFrom-Json).Hash
          $actual = (Get-FileHash $manifestPath -Algorithm SHA256).Hash

          if ($actual -ne $expected) { throw 'Backup manifest SHA256 validation failed.' }
          if ($manifest.backup_version -ne 1) { throw "Unsupported backup version: $($manifest.backup_version)" }

          Write-Host "Backup created: $($manifest.created_at)"
          Write-Host "Source workflow run: $($manifest.workflow_run_id)"

          $sourceRoot = Join-Path $downloadDir 'NvDAdmin'
          $targetRoot = 'C:\Users\NvDAdmin'
          $relativeFolders = @(
            'Desktop',
            'Documents',
            'Downloads',
            'Pictures',
            'Music',
            'Videos',
            'AppData\Roaming',
            'AppData\Local\Programs',
            'AppData\Local\Google\Chrome\User Data',
            'AppData\Local\Microsoft\Edge\User Data',
            'AppData\Roaming\Mozilla\Firefox'
          )

          if (-not (Test-Path $sourceRoot)) {
              Write-Host 'No user-profile payload exists in the backup.'
          }
          elseif (Test-Path $targetRoot) {
              Write-Host 'NvDAdmin profile exists. Performing immediate restore.'
              foreach ($relative in $relativeFolders) {
                  $src = Join-Path $sourceRoot $relative
                  if (-not (Test-Path $src)) { continue }
                  $dst = Join-Path $targetRoot $relative
                  New-Item -ItemType Directory -Path $dst -Force | Out-Null
                  $excludeDirs = @('Cache','Code Cache','GPUCache','ShaderCache','GrShaderCache','DawnCache','Service Worker\CacheStorage','Service Worker\ScriptCache')
                  $excludeArgs = @()
                  foreach ($name in $excludeDirs) { $excludeArgs += '/XD'; $excludeArgs += (Join-Path $src $name) }
                  robocopy $src $dst /E /ZB /R:1 /W:1 /XJ @excludeArgs | Out-Host
                  if ($LASTEXITCODE -ge 8) { throw "Restore failed for $relative. Robocopy exit code: $LASTEXITCODE" }
              }
          }
          else {
              Write-Host 'NvDAdmin profile does not exist yet. Creating first-logon restore task.'
              $taskScript = 'C:\RDPBackup\restore-on-logon.ps1'
              $script = @'
          $ErrorActionPreference = 'Stop'
          $sourceRoot = 'C:\RDPBackup\Restore\Downloaded\NvDAdmin'
          $targetRoot = $env:USERPROFILE
          $log = 'C:\RDPBackup\Logs\restore-on-logon.txt'
          New-Item -ItemType Directory -Path (Split-Path $log) -Force | Out-Null
          "Restore started: $(Get-Date -Format o)" | Add-Content $log
          $relativeFolders = @(
            'Desktop','Documents','Downloads','Pictures','Music','Videos',
            'AppData\Roaming','AppData\Local\Programs',
            'AppData\Local\Google\Chrome\User Data',
            'AppData\Local\Microsoft\Edge\User Data',
            'AppData\Roaming\Mozilla\Firefox'
          )
          foreach ($relative in $relativeFolders) {
            $src = Join-Path $sourceRoot $relative
            if (-not (Test-Path $src)) { continue }
            $dst = Join-Path $targetRoot $relative
            New-Item -ItemType Directory -Path $dst -Force | Out-Null
            robocopy $src $dst /E /ZB /R:1 /W:1 /XJ | Out-File $log -Append
            $code = $LASTEXITCODE
            if ($code -ge 8) { "FAILED: $relative code=$code" | Add-Content $log; exit $code }
          }
          "Restore completed: $(Get-Date -Format o)" | Add-Content $log
          try { Unregister-ScheduledTask -TaskName 'WindowsCloudRDP-Restore' -Confirm:$false -ErrorAction SilentlyContinue } catch {}
          try { Remove-Item $sourceRoot -Recurse -Force -ErrorAction SilentlyContinue } catch {}
          '@
              Set-Content -Path $taskScript -Value $script -Encoding UTF8
              $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$taskScript`""
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User 'NvDAdmin'
              $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Hours 1)
              Unregister-ScheduledTask -TaskName 'WindowsCloudRDP-Restore' -Confirm:$false -ErrorAction SilentlyContinue
              Register-ScheduledTask -TaskName 'WindowsCloudRDP-Restore' -Action $action -Trigger $trigger -Settings $settings -User 'NvDAdmin' -Password 'P@ssw0rd1qazXSW@#' -RunLevel Highest -Force | Out-Null
          }

          $appsExport = Join-Path $downloadDir 'Applications\winget-export.json'
          if (Test-Path $appsExport) {
              Copy-Item $appsExport 'C:\RDPBackup\Restore\winget-export.json' -Force
          }

      - name: 7. Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) { throw 'TAILSCALE_AUTHKEY GitHub Secret is missing.' }

          $installer = 'C:\tailscale.msi'
          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if (-not (Test-Path $tailscale)) {
              Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $installer -UseBasicParsing
              $p = Start-Process 'msiexec.exe' -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "Tailscale install failed: $($p.ExitCode)" }
          }

          Start-Sleep -Seconds 8
          & $tailscale up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server-part-$env:PART_NUMBER" --accept-dns=true
          if ($LASTEXITCODE -ne 0) { throw 'Tailscale up failed.' }
          Start-Sleep -Seconds 8
          & $tailscale status
          if ($LASTEXITCODE -ne 0) { throw 'Tailscale status failed.' }

      - name: 8. Optional WinGet Application Restore
        if: ${{ inputs.restore_apps }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $exportFile = 'C:\RDPBackup\Restore\winget-export.json'
          $logFile = 'C:\RDPBackup\Logs\winget-import.log'

          if (-not (Test-Path $exportFile)) { Write-Host 'No WinGet export found. Skipping.'; exit 0 }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Host 'WinGet unavailable. Skipping.'; exit 0 }

          winget source update --accept-source-agreements --disable-interactivity 2>&1 | Out-File $logFile -Append
          winget import --import-file $exportFile --accept-source-agreements --accept-package-agreements --ignore-unavailable --ignore-versions --disable-interactivity 2>&1 | Out-File $logFile -Append
          Write-Host 'WinGet best-effort import completed.'

      - name: 9. Verify RDP and Show Connection Info
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          for ($i = 1; $i -le 12; $i++) {
              $ip = (& $tailscale ip -4 2>$null).Trim()
              if ($ip) { break }
              Start-Sleep -Seconds 5
          }
          if (-not $ip) { throw 'Could not obtain Tailscale IPv4.' }

          $rdp = Get-Service -Name 'TermService'
          if ($rdp.Status -ne 'Running') { Start-Service 'TermService'; Start-Sleep 5 }
          $check = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if (-not $check.TcpTestSucceeded) { throw 'Local RDP port 3389 is not listening.' }

          "TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Append
          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host " WINDOWS CLOUD RDP - PART $env:PART_NUMBER / 8" -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host "Tailscale IP : $ip" -ForegroundColor Yellow
          Write-Host 'Username     : NvDAdmin' -ForegroundColor Yellow
          Write-Host 'Password     : P@ssw0rd1qazXSW@#' -ForegroundColor Yellow
          Write-Host "Connect with: mstsc /v:$ip" -ForegroundColor Magenta
          Write-Host '==================================================' -ForegroundColor Green

      - name: 10. Capture Application and System Inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $logDir = 'C:\RDPBackup\Logs'
          $appDir = 'C:\RDPBackup\Snapshot\Applications'
          New-Item -ItemType Directory -Path $appDir -Force | Out-Null

          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture,OsTotalVisibleMemorySize |
            ConvertTo-Json -Depth 5 | Set-Content (Join-Path $logDir 'system-info.json') -Encoding UTF8

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption,Version,BuildNumber,LastBootUpTime,TotalVisibleMemorySize,FreePhysicalMemory |
            ConvertTo-Json -Depth 3 | Set-Content (Join-Path $logDir 'os-info.json') -Encoding UTF8

          $uninstallPaths = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')
          Get-ItemProperty $uninstallPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName } |
            Select-Object DisplayName,DisplayVersion,Publisher,InstallDate,UninstallString |
            Sort-Object DisplayName -Unique |
            Export-Csv (Join-Path $appDir 'installed-programs.csv') -NoTypeInformation -Encoding UTF8

          if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget export --output (Join-Path $appDir 'winget-export.json') --accept-source-agreements --disable-interactivity 2>&1 |
                Out-File (Join-Path $logDir 'winget-export.log') -Append
          }

          & 'C:\Program Files\Tailscale\tailscale.exe' status | Out-File (Join-Path $logDir 'tailscale-status.txt') -Encoding UTF8

      - name: 11. Keep Server Alive Until Backup Window
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $backupAt = [DateTime]::Parse($env:PART_BACKUP_AT).ToLocalTime()
          while ((Get-Date) -lt $backupAt) {
              Start-Sleep -Seconds 60
              $rdp = Get-Service -Name 'TermService' -ErrorAction SilentlyContinue
              if ($rdp -and $rdp.Status -ne 'Running') { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }
              $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
              $ip = (& $tailscale ip -4 2>$null).Trim()
              if (-not $ip) {
                  & $tailscale up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server-part-$env:PART_NUMBER" --accept-dns=true 2>&1 | Out-Host
                  $ip = (& $tailscale ip -4 2>$null).Trim()
              }
              $remaining = [math]::Max(0,[int](($backupAt-(Get-Date)).TotalMinutes))
              Write-Host "PART $env:PART_NUMBER | RDP=$($rdp.Status) | Tailscale=$ip | Backup in ~$remaining min"
          }

      - name: 12. Create Environment Snapshot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = 'C:\RDPBackup\Snapshot'
          $profile = 'C:\Users\NvDAdmin'

          # Recreate only generated data folders; application inventory is regenerated below.
          Remove-Item (Join-Path $snapshot 'NvDAdmin') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $snapshot 'Public') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $snapshot 'Metadata') -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $snapshot 'NvDAdmin') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $snapshot 'Public\Desktop') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $snapshot 'Metadata') -Force | Out-Null

          $relativeFolders = @(
            'Desktop','Documents','Downloads','Pictures','Music','Videos',
            'AppData\Roaming','AppData\Local\Programs',
            'AppData\Local\Google\Chrome\User Data',
            'AppData\Local\Microsoft\Edge\User Data',
            'AppData\Roaming\Mozilla\Firefox'
          )

          if (Test-Path $profile) {
              foreach ($relative in $relativeFolders) {
                  $src = Join-Path $profile $relative
                  if (-not (Test-Path $src)) { continue }
                  $dst = Join-Path $snapshot (Join-Path 'NvDAdmin' $relative)
                  New-Item -ItemType Directory -Path $dst -Force | Out-Null
                  robocopy $src $dst /E /ZB /R:1 /W:1 /XJ | Out-Host
                  if ($LASTEXITCODE -ge 8) { throw "Snapshot failed for $relative. Robocopy exit code: $LASTEXITCODE" }
              }
          }

          if (Test-Path 'C:\Users\Public\Desktop') {
              robocopy 'C:\Users\Public\Desktop' (Join-Path $snapshot 'Public\Desktop') /E /ZB /R:1 /W:1 /XJ | Out-Host
              if ($LASTEXITCODE -ge 8) { throw 'Public Desktop snapshot failed.' }
          }

          $files = @(Get-ChildItem $snapshot -File -Recurse -Force -ErrorAction SilentlyContinue)
          $bytes = ($files | Measure-Object Length -Sum).Sum
          if ($null -eq $bytes) { $bytes = 0 }

          $manifest = [ordered]@{
            backup_version = 1
            part = [int]$env:PART_NUMBER
            created_at = (Get-Date).ToUniversalTime().ToString('o')
            workflow_run_id = $env:GITHUB_RUN_ID
            repository = $env:GITHUB_REPOSITORY
            runner_os = $env:RUNNER_OS
            file_count = $files.Count
            total_bytes = [int64]$bytes
            contains_user_profile = (Test-Path (Join-Path $snapshot 'NvDAdmin'))
            includes_desktop_documents_downloads = $true
            includes_browser_profiles = $true
            includes_application_inventory = $true
            note = 'Portable user/application data only; not a full Windows system image. Browser databases can be incomplete when applications are actively using locked files.'
          }

          $manifestPath = Join-Path $snapshot 'Metadata\manifest.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $manifestPath -Encoding UTF8
          Get-FileHash $manifestPath -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $snapshot 'Metadata\manifest.sha256.json') -Encoding UTF8

          Write-Host "Snapshot files: $($files.Count)"
          Write-Host "Snapshot bytes: $bytes"

      - name: 13. Validate and Upload Part Backup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = 'C:\RDPBackup\Snapshot'
          $manifestPath = Join-Path $snapshot 'Metadata\manifest.json'
          $hashPath = Join-Path $snapshot 'Metadata\manifest.sha256.json'
          if (-not (Test-Path $manifestPath)) { throw 'manifest.json is missing.' }
          if (-not (Test-Path $hashPath)) { throw 'manifest.sha256.json is missing.' }
          $expected = (Get-Content $hashPath -Raw | ConvertFrom-Json).Hash
          $actual = (Get-FileHash $manifestPath -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Snapshot manifest hash mismatch.' }
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($m.part -ne [int]$env:PART_NUMBER) { throw 'Snapshot part number mismatch.' }
          if ($m.workflow_run_id -ne $env:GITHUB_RUN_ID) { throw 'Snapshot workflow run mismatch.' }
          if (@(Get-ChildItem $snapshot -File -Recurse).Count -lt 2) { throw 'Snapshot is unexpectedly empty.' }
          Write-Host 'Snapshot validation passed.'

      - name: 14. Upload Part Backup
        uses: actions/upload-artifact@v4
        with:
          name: windows-cloud-backup-part${{ env.PART_NUMBER }}-${{ github.run_id }}
          path: C:\RDPBackup\Snapshot
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: true
          retention-days: 14

      - name: 15. Keep Server Alive After Backup
        shell: powershell
        run: |
          $deadline = [DateTime]::Parse($env:PART_DEADLINE_AT).ToLocalTime()
          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 60
              $rdp = Get-Service -Name 'TermService' -ErrorAction SilentlyContinue
              if ($rdp -and $rdp.Status -ne 'Running') { Start-Service -Name 'TermService' -ErrorAction SilentlyContinue }
              $ip = (& $tailscale ip -4 2>$null).Trim()
              $remaining = [math]::Max(0,[int](($deadline-(Get-Date)).TotalMinutes))
              Write-Host "PART $env:PART_NUMBER FINAL | RDP=$($rdp.Status) | Tailscale=$ip | Remaining ~$remaining min"
          }

      - name: 16. Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rdp-diagnostics-part${{ env.PART_NUMBER }}-${{ github.run_id }}
          path: C:\RDPBackup\Logs
          if-no-files-found: warn
          compression-level: 6
          include-hidden-files: true
          retention-days: 7

      - name: 17. Final Status
        if: always()
        shell: powershell
        run: |
          Write-Host '=================================================='
          Write-Host "WINDOWS CLOUD RDP - PART $env:PART_NUMBER COMPLETE"
          Write-Host '=================================================='
          $rdp = Get-Service -Name 'TermService' -ErrorAction SilentlyContinue
          Write-Host "RDP service: $($rdp.Status)"
          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          if (Test-Path $tailscale) {
              Write-Host 'Tailscale IPv4:'
              & $tailscale ip -4
          }
          Write-Host '=================================================='
  part2:
    needs: part1
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PART_NUMBER: '2'

    steps:
      - name: 1. Initialize Part Timing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $start = Get-Date
          $backupAt = $start.AddMinutes(330)
          $deadline = $start.AddMinutes(350)

          "PART_STARTED_AT=$($start.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_BACKUP_AT=$($backupAt.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append
          "PART_DEADLINE_AT=$($deadline.ToUniversalTime().ToString('o'))" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Part $env:PART_NUMBER started at: $start"
          Write-Host "Backup phase at: $backupAt"
          Write-Host "Part deadline: $deadline"

      - name: 2. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-Service -Name 'TermService' -StartupType Automatic
          Start-Service -Name 'TermService' -ErrorAction SilentlyContinue

          $svc = Get-Service -Name 'TermService'
          if ($svc.Status -ne 'Running') {
              throw 'Remote Desktop service could not be started.'
          }

      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Password = ConvertTo-SecureString 'P@ssw0rd1qazXSW@#' -AsPlainText -Force
          $existingUser = Get-LocalUser -Name 'NvDAdmin' -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              New-LocalUser -Name 'NvDAdmin' -Password $Password -PasswordNeverExpires -AccountNeverExpires -Description 'Windows Cloud RDP Admin'
          } else {
              Set-LocalUser -Name 'NvDAdmin' -Password $Password
              Enable-LocalUser -Name 'NvDAdmin'
          }

          Add-LocalGroupMember -Group 'Administrators' -Member 'NvDAdmin' -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 4. Prepare Backup Directories
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path 'C:\RDPBackup\Restore\Downloaded' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\RDPBackup\Snapshot' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\RDPBackup\Logs' -Force | Out-Null
          icacls 'C:\RDPBackup' /grant 'NvDAdmin:(OI)(CI)F' /T /C | Out-Null

      - name: 5. Restore Previous Part Backup
        uses: actions/download-artifact@v5
        with:
          name: windows-cloud-backup-part1-${{ github.run_id }}
          path: C:\RDPBackup\Restore\Downloaded
          merge-multiple: true

      - name: 6. Validate and Restore Backup Data
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
